name: Audit source documents and inspiration videos

on:
  workflow_dispatch:
  push:
    branches:
      - feat/anmay-defence-multipage-site
    paths-ignore:
      - "source-review/**"
      - ".github/workflows/source-audit.yml"

permissions:
  contents: write

jobs:
  inspect-source-library:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Sparse checkout source documents and reference videos
        uses: actions/checkout@v4
        with:
          lfs: true
          fetch-depth: 1
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /inspiration_video/
            /assets/Drone detection Videos and Photos/ANMAY_Drone_Defence_Video_Script.docx
            /assets/Drone detection Videos and Photos/Shortlisted Photo Video/Changes .pptx
            /assets/StrikeGenOne_videos/STRIKE GEN 1 shots/STRIKE Product Catalogue Gen1 and 2.pptx
            /assets/StrikeGenOne_videos/STRIKE GEN 1 shots/STRIKE_Video_Creation_Storyboard_Anmay_Defence.docx
            /assets/StrikeGenOne_videos/StrikeGenVideos/New Video Script.docx
            /assets/StrikeGenOne_videos/StrikeGenVideos/PRAHAR NETRA Product Catalogue.pptx

      - name: Install FFmpeg and document parsers
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          python -m pip install --upgrade pip
          python -m pip install python-docx python-pptx pillow

      - name: Extract Office text and timestamped inspiration frames
        shell: bash
        run: |
          mkdir -p source-review/video-frames source-review/extracted-text
          cat > /tmp/audit_sources.py <<'PY'
          from pathlib import Path
          import subprocess, re, math, json, hashlib, shutil
          from docx import Document
          from pptx import Presentation
          from PIL import Image, ImageDraw, ImageFont

          root = Path(".")
          out = root / "source-review"
          text_dir = out / "extracted-text"
          sheet_dir = out / "video-frames"
          temp_root = Path("/tmp/anmay-video-frame-samples")
          if temp_root.exists():
              shutil.rmtree(temp_root)
          text_dir.mkdir(parents=True, exist_ok=True)
          sheet_dir.mkdir(parents=True, exist_ok=True)
          temp_root.mkdir(parents=True, exist_ok=True)

          def clean(s):
              return re.sub(r"\s+", " ", (s or "")).strip()

          def dump_docx(path):
              doc = Document(path)
              lines = ["# " + path.name, "", "Source path: " + path.as_posix(), ""]
              for p in doc.paragraphs:
                  s = clean(p.text)
                  if s:
                      lines.append(s)
              for ti, table in enumerate(doc.tables, 1):
                  lines += ["", "## Table " + str(ti)]
                  for row in table.rows:
                      cells = [clean(c.text) for c in row.cells]
                      if any(cells):
                          lines.append(" | ".join(cells))
              return "\n".join(lines) + "\n"

          def dump_pptx(path):
              prs = Presentation(path)
              lines = ["# " + path.name, "", "Source path: " + path.as_posix(),
                       "", "Slide count: " + str(len(prs.slides)), ""]
              for si, slide in enumerate(prs.slides, 1):
                  lines += ["", "## Slide " + str(si)]
                  for shape in slide.shapes:
                      if getattr(shape, "has_text_frame", False):
                          t = clean("\n".join(p.text for p in shape.text_frame.paragraphs))
                          if t:
                              lines.append(t)
                      if getattr(shape, "has_table", False):
                          for row in shape.table.rows:
                              cells = [clean(cell.text) for cell in row.cells]
                              if any(cells):
                                  lines.append(" | ".join(cells))
                      if getattr(shape, "shape_type", None) == 6:
                          for sub in shape.shapes:
                              if getattr(sub, "has_text_frame", False):
                                  t = clean("\n".join(p.text for p in sub.text_frame.paragraphs))
                                  if t:
                                      lines.append(t)
                  try:
                      notes = clean(slide.notes_slide.notes_text_frame.text)
                      if notes and notes not in ("Slide Image", str(si)):
                          lines += ["", "Speaker notes: " + notes]
                  except Exception:
                      pass
              return "\n".join(lines) + "\n"

          md_index = ["# Anmay Defence source-document extraction", "",
                      "Generated using python-docx and python-pptx. Source originals are unchanged.", ""]
          documents = sorted([*root.glob("assets/**/*.docx"), *root.glob("assets/**/*.pptx")])
          for path in documents:
              try:
                  body = dump_docx(path) if path.suffix.lower() == ".docx" else dump_pptx(path)
                  stem = re.sub(r"[^A-Za-z0-9_-]+", "-", path.stem).strip("-")
                  dest = text_dir / (stem + ".md")
                  if dest.exists():
                      dest = text_dir / (hashlib.sha1(path.as_posix().encode()).hexdigest()[:8] + "-" + dest.name)
                  dest.write_text(body, encoding="utf-8")
                  md_index.append("- " + path.as_posix() + " -> " + dest.as_posix() +
                                  " (" + str(len(body)) + " characters)")
              except Exception as e:
                  md_index.append("- ERROR " + path.as_posix() + ": " + type(e).__name__ + ": " + str(e))
          (out / "DOCUMENT_INDEX.md").write_text("\n".join(md_index) + "\n", encoding="utf-8")

          video_paths = sorted((root / "inspiration_video").glob("*"))
          video_rows = ["# Inspiration video audit", "",
              "Reference clips are sampled at 2 frames per second using FFmpeg. Labeled contact sheets preserve clip order and timestamps. Palette statistics are approximate sample values, not exact CSS-token extraction.", ""]
          all_small_images = []
          global_sheet = 1
          try:
              font = ImageFont.truetype("/usr/share/fonts/truetype/dejavu/DejaVuSans.ttf", 12)
          except Exception:
              font = ImageFont.load_default()
          thumb_w, thumb_h, cols, rows = 320, 210, 4, 4
          per_sheet = cols * rows

          for video in video_paths:
              if not video.is_file():
                  continue
              try:
                  probe = subprocess.run(
                      ["ffprobe", "-v", "error", "-show_entries", "format=duration,size",
                       "-of", "json", str(video)], capture_output=True, text=True, check=True)
                  meta = json.loads(probe.stdout).get("format", {})
                  duration = float(meta.get("duration", 0))
                  size = int(meta.get("size", 0))
                  safe = re.sub(r"[^A-Za-z0-9_-]+", "-", video.stem).strip("-")
                  tmp = temp_root / (safe + "-frames")
                  tmp.mkdir(exist_ok=True)
                  subprocess.run([
                      "ffmpeg", "-hide_banner", "-loglevel", "error", "-y", "-i", str(video),
                      "-vf", "fps=2,scale=360:-1:flags=lanczos", "-q:v", "4",
                      str(tmp / "frame-%05d.jpg")], check=True)
                  frames = sorted(tmp.glob("frame-*.jpg"))
                  video_rows.append("- " + video.as_posix() + " — " + str(round(duration, 1)) +
                                    "s, " + str(size) + " bytes, " + str(len(frames)) + " sampled frames.")
                  thumbs = []
                  for fi, frame in enumerate(frames):
                      im = Image.open(frame).convert("RGB")
                      small = im.copy()
                      small.thumbnail((48, 48))
                      all_small_images.append(small.copy())
                      im.thumbnail((thumb_w-8, 174), Image.Resampling.LANCZOS)
                      thumbs.append((fi / 2.0, im.copy()))
                  for chunk in range(math.ceil(len(thumbs) / per_sheet)):
                      group = thumbs[chunk*per_sheet:(chunk+1)*per_sheet]
                      sheet = Image.new("RGB", (cols*thumb_w, rows*thumb_h), (15,18,25))
                      draw = ImageDraw.Draw(sheet)
                      for bi, (seconds, im) in enumerate(group):
                          x = (bi % cols) * thumb_w + (thumb_w-im.width)//2
                          y = (bi // cols) * thumb_h + 3
                          sheet.paste(im, (x, y))
                          label = video.stem[:20] + "  " + ("%05.1fs" % seconds)
                          draw.text(((bi%cols)*thumb_w+6, (bi//cols)*thumb_h+181),
                                    label, font=font, fill=(230,233,240))
                      name = "contact-sheet-" + str(global_sheet).zfill(3) + ".jpg"
                      sheet.save(sheet_dir / name, quality=83, optimize=True)
                      video_rows.append("  - Contact sheet: " + name + " (frames " +
                                        str(chunk*per_sheet+1) + "–" +
                                        str(min((chunk+1)*per_sheet, len(thumbs))) + ")")
                      global_sheet += 1

                  video_rows.append("")
              except Exception as e:
                  video_rows.append("- ERROR " + video.as_posix() + ": " + type(e).__name__ + ": " + str(e))

          if all_small_images:
              mosaic = Image.new("RGB", (48, 48*len(all_small_images)))
              for i, im in enumerate(all_small_images):
                  mosaic.paste(im, (0, i*48))
              quantized = mosaic.quantize(colors=12, method=Image.Quantize.MEDIANCUT)
              palette = quantized.getpalette() or []
              counts = quantized.getcolors(maxcolors=48*48*len(all_small_images)) or []
              counts.sort(reverse=True)
              video_rows += ["", "## Approximate dominant sample colors", "",
                             "| Approximate color | Relative sample count |",
                             "|---|---:|"]
              total = max(1, sum(n for n, idx in counts))
              for n, idx in counts[:12]:
                  rgb = palette[idx*3:idx*3+3]
                  if len(rgb) == 3:
                      video_rows.append("| #%02X%02X%02X | %.1f%% |" %
                                        (rgb[0], rgb[1], rgb[2], 100*n/total))
          (out / "INSPIRATION_VIDEO_INDEX.md").write_text("\n".join(video_rows) + "\n", encoding="utf-8")
          PY
          python /tmp/audit_sources.py
          cat > source-review/README.md <<'EOF'
          # Anmay Defence source audit
          Office text extraction and FFmpeg frame contact sheets for the original scripts, product catalogues and ten inspiration clips. Frames are timestamped and grouped by the original clip order.
          EOF

      - name: Publish audit outputs
        uses: actions/upload-artifact@v4
        with:
          name: anmay-source-audit
          path: source-review/
          retention-days: 14

      - name: Commit source text and contact sheets to the feature branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add source-review/
          if ! git diff --cached --quiet; then
            git commit -m "Add source document extraction and inspiration video frame audit"
            git push origin HEAD:$GITHUB_REF_NAME
          fi
