name: Audit source documents and inspiration videos

on:
  push:
    branches:
      - feat/anmay-defence-multipage-site
    paths-ignore:
      - "source-review/**"
      - ".github/workflows/source-audit.yml"

permissions:
  contents: write

jobs:
  inspect-source-library:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository with Git LFS objects
        uses: actions/checkout@v4
        with:
          lfs: true
          fetch-depth: 0
      - name: Install FFmpeg and document parsers
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          python -m pip install --upgrade pip
          python -m pip install python-docx python-pptx pillow
      - name: Extract document text and video review frames
        shell: bash
        run: |
          mkdir -p source-review/video-frames source-review/extracted-text
          cat > /tmp/audit_sources.py <<'PY'
          from pathlib import Path
          import subprocess, re, math, json, hashlib
          from docx import Document
          from pptx import Presentation
          from PIL import Image, ImageDraw, ImageFont

          root = Path(".")
          out = root / "source-review"
          text_dir = out / "extracted-text"
          frame_dir = out / "video-frames"
          text_dir.mkdir(parents=True, exist_ok=True)
          frame_dir.mkdir(parents=True, exist_ok=True)

          def clean(s):
              return re.sub(r"\s+", " ", (s or "")).strip()

          def dump_docx(path):
              doc = Document(path)
              lines = ["# " + path.name, "", "Source path: " + path.as_posix(), ""]
              for p in doc.paragraphs:
                  s = clean(p.text)
                  if s:
                      lines.append(s)
              for ti, table in enumerate(doc.tables, 1):
                  lines += ["", "## Table " + str(ti)]
                  for row in table.rows:
                      cells = [clean(c.text) for c in row.cells]
                      if any(cells):
                          lines.append(" | ".join(cells))
              return "\n".join(lines) + "\n"

          def dump_pptx(path):
              prs = Presentation(path)
              lines = ["# " + path.name, "", "Source path: " + path.as_posix(), "", "Slide count: " + str(len(prs.slides)), ""]
              for si, slide in enumerate(prs.slides, 1):
                  lines += ["", "## Slide " + str(si)]
                  for shape in slide.shapes:
                      if getattr(shape, "has_text_frame", False):
                          t = clean("\n".join(p.text for p in shape.text_frame.paragraphs))
                          if t:
                              lines.append(t)
                      if getattr(shape, "has_table", False):
                          for row in shape.table.rows:
                              cells = [clean(cell.text) for cell in row.cells]
                              if any(cells):
                                  lines.append(" | ".join(cells))
                      if getattr(shape, "shape_type", None) == 6:
                          for sub in shape.shapes:
                              if getattr(sub, "has_text_frame", False):
                                  t = clean("\n".join(p.text for p in sub.text_frame.paragraphs))
                                  if t:
                                      lines.append(t)
                  try:
                      notes = clean(slide.notes_slide.notes_text_frame.text)
                      if notes and notes not in ("Slide Image", str(si)):
                          lines += ["", "Speaker notes: " + notes]
                  except Exception:
                      pass
              return "\n".join(lines) + "\n"

          md_index = ["# Anmay Defence source-document extraction", "",
                      "Generated using python-docx and python-pptx. Original source documents are unchanged.", ""]
          doc_paths = sorted([*root.glob("assets/**/*.docx"), *root.glob("assets/**/*.pptx")])
          for path in doc_paths:
              try:
                  body = dump_docx(path) if path.suffix.lower() == ".docx" else dump_pptx(path)
                  dest = text_dir / (path.stem.replace("/", "_") + ".md")
                  if dest.exists():
                      dest = text_dir / (hashlib.sha1(path.as_posix().encode()).hexdigest()[:8] + "-" + dest.name)
                  dest.write_text(body, encoding="utf-8")
                  md_index += ["- " + path.as_posix() + " -> " + dest.as_posix() + " (" + str(len(body)) + " characters)"]
              except Exception as e:
                  md_index += ["- ERROR " + path.as_posix() + ": " + type(e).__name__ + ": " + str(e)]
          (out / "DOCUMENT_INDEX.md").write_text("\n".join(md_index) + "\n", encoding="utf-8")

          video_paths = sorted((root / "inspiration_video").glob("*"))
          video_rows = ["# Inspiration video audit", "",
                        "Frames sampled at 1 frame per second with FFmpeg; frames are chronologically arranged in labeled contact sheets.", ""]
          all_frames = []
          for video in video_paths:
              if not video.is_file():
                  continue
              try:
                  probe = subprocess.run(["ffprobe", "-v", "error", "-show_entries", "format=duration,size", "-of", "json", str(video)], capture_output=True, text=True, check=True)
                  meta = json.loads(probe.stdout).get("format", {})
                  dur = float(meta.get("duration", 0))
                  size = int(meta.get("size", 0))
                  safe = re.sub(r"[^A-Za-z0-9_-]+", "-", video.stem).strip("-")
                  tmp = frame_dir / (safe + "-frames")
                  tmp.mkdir(exist_ok=True)
                  subprocess.run(["ffmpeg", "-hide_banner", "-loglevel", "error", "-y", "-i", str(video),
                                  "-vf", "fps=1,scale=400:-1:flags=lanczos", "-q:v", "3", str(tmp / "frame-%05d.jpg")], check=True)
                  frames = sorted(tmp.glob("frame-*.jpg"))
                  video_rows.append("- " + video.as_posix() + " — " + str(round(dur, 1)) + "s, " + str(size) + " bytes, " + str(len(frames)) + " sampled frames.")
                  for fi, f in enumerate(frames):
                      im = Image.open(f).convert("RGB")
                      all_frames.append((video.name, fi, im.copy()))
              except Exception as e:
                  video_rows.append("- ERROR " + video.as_posix() + ": " + type(e).__name__ + ": " + str(e))

          try:
              font = ImageFont.truetype("/usr/share/fonts/truetype/dejavu/DejaVuSans.ttf", 13)
          except Exception:
              font = ImageFont.load_default()
          thumb_w, thumb_h, cols, rows = 320, 210, 4, 4
          per_sheet = cols * rows
          for si in range(math.ceil(len(all_frames) / per_sheet)):
              batch = all_frames[si*per_sheet:(si+1)*per_sheet]
              sheet = Image.new("RGB", (cols*thumb_w, rows*thumb_h), (20,22,27))
              draw = ImageDraw.Draw(sheet)
              for bi, (name, sec, im) in enumerate(batch):
                  im.thumbnail((thumb_w-8, 174), Image.Resampling.LANCZOS)
                  x = (bi % cols) * thumb_w + (thumb_w-im.width)//2
                  y = (bi // cols) * thumb_h + 3
                  sheet.paste(im, (x,y))
                  label = name[:25] + " @ " + str(sec).zfill(3) + "s"
                  draw.text(((bi%cols)*thumb_w+6, (bi//cols)*thumb_h+180), label, font=font, fill=(230,233,240))
              sheet.save(frame_dir / ("contact-sheet-" + str(si+1).zfill(3) + ".jpg"), quality=86, optimize=True)
          (out / "INSPIRATION_VIDEO_INDEX.md").write_text("\n".join(video_rows) + "\n", encoding="utf-8")
          PY
          python /tmp/audit_sources.py
          cat > source-review/README.md <<'EOF'
          # Temporary source audit
          Generated from the original DOCX/PPTX and inspiration MOV files to enable accurate website content and design reconstruction. Contact sheets use one sampled frame per second. They are analysis references, not site artwork.
          EOF
      - name: Publish audit outputs for review
        uses: actions/upload-artifact@v4
        with:
          name: anmay-source-audit
          path: source-review/
          retention-days: 14
      - name: Commit extracted source text and frame sheets for review
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add source-review/
          if ! git diff --cached --quiet; then
            git commit -m "Add source document extraction and inspiration video frame audit"
            git push origin HEAD:$GITHUB_REF_NAME
          fi
